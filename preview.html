<style>

/* Jessica's palette: deep purple, hot pink, amber — plus a purple-tinted dark
   ground instead of navy so the whole app reads as one system. Font stack
   leads with Century Gothic (her house font) and falls back to Jost, a
   Google-hosted geometric sans that's the closest visual match for people
   who don't have Century Gothic installed. */
:root{
  --bg: #170f22;
  --panel: #221732;
  --panel-2: #2b1e3f;
  --border: #3e2b57;
  --text: #f2ecf9;
  --text-dim: #b5a2cb;
  --text-faint: #7a6690;
  --accent-purple: #7c3aed;
  --accent-pink: #ff2e92;
  --accent-amber: #ffb020;
  --accent-cyan: var(--accent-pink);
  --accent-orange: var(--accent-pink);
  --accent-teal: var(--accent-amber);
  --accent-gold: var(--accent-amber);
  --accent-green: #3ecf8e;
  --accent-red: #ff5470;
  --radius: 8px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Century Gothic', CenturyGothic, 'Jost', 'Poppins', ui-sans-serif, sans-serif;
  min-height:100vh;
  padding-bottom: 64px;
}

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input, select, textarea{ font-family:inherit; }

.clock, .stat-card .value, .points-row .v, .summary-row .v, table td,
.slot .time, .toggle-grid button, .day-bar-row{ font-variant-numeric: tabular-nums; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.topbar .brand{ display:flex; align-items:baseline; gap:8px; }
.topbar .brand .name{ color: var(--accent-cyan); font-weight:700; letter-spacing:1px; font-size:15px; }
.topbar .brand .ver{ color: var(--text-faint); font-size:11px; }
.topbar .clock{ font-weight:700; font-size:14px; }
.topbar .clock .tz{ color:var(--text-faint); font-size:10px; margin-left:4px; }
.topbar .signin{ color: var(--accent-purple); font-size:12px; letter-spacing:1px; background:none; border:none; }
.topbar .signin:hover{ text-decoration:underline; }
.topbar .who{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-dim); }
.topbar .who button{ background:none;border:1px solid var(--border); color:var(--text-dim); padding:4px 8px; border-radius:4px; }

main{ max-width: 900px; margin: 0 auto; padding: 16px; }

.section-label{
  color: var(--text-faint); font-size:11px; letter-spacing:1px; margin: 18px 0 10px;
  display:flex; align-items:center; gap:6px;
}

.grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
@media (max-width:600px){ .grid2{ grid-template-columns: 1fr; } }

.card{
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.card.clickable{ cursor:pointer; transition: background .15s; }
.card.clickable:hover{ background: var(--panel-2); }

.op-card h3{ margin:0 0 6px; font-size:16px; display:flex; justify-content:space-between; align-items:center; }
.op-card p{ margin:0 0 10px; color:var(--text-dim); font-size:12.5px; line-height:1.4; }
.op-card .meta{ font-size:11px; color:var(--text-faint); letter-spacing:.5px; }
.op-card .meta b{ color: var(--text-dim); }

.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }

.stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.stat-card .label{ font-size:11px; color:var(--text-faint); letter-spacing:1px; }
.stat-card .value{ font-size:26px; font-weight:700; margin:4px 0; }

.tabs{ display:flex; gap:22px; border-bottom:1px solid var(--border); margin-bottom:16px; }

.tabs button.active{ color: var(--accent-active, var(--accent-purple)); border-color: var(--accent-active, var(--accent-purple)); }

.eyebrow{ color:var(--text-faint); font-size:11px; letter-spacing:1px; }

.field-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:10.5px; color:var(--text-faint); letter-spacing:1px; }
.field select, .field input{

  padding:8px 10px; border-radius:4px; min-width:170px; font-size:13px;
}

.panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }

.vs-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }

.vs-row .side.home{ color: var(--accent-pink); }

.bar-outer{ height:8px; border-radius:4px; background:var(--panel-2); overflow:hidden; display:flex; margin:6px 0 10px; }
.bar-fill.home{ background: var(--accent-pink); }

.day-bar-row{ display:grid; grid-template-columns: 30px 1fr 1fr; gap:8px; align-items:center; font-size:11.5px; margin-bottom:6px; color:var(--text-dim); }
.day-bar{ height:14px; border-radius:3px; background:var(--panel-2); position:relative; overflow:hidden; }
.day-bar .fill{ height:100%; }
.day-bar .fill.home{ background:var(--accent-pink); }
.day-bar .fill.enemy{ background:var(--accent-cyan); }

.note{ background: rgba(78,203,133,0.08); border:1px solid rgba(78,203,133,0.35); color:var(--accent-green); border-radius:4px; padding:10px 12px; font-size:12px; margin-top:8px; }

table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th{ text-align:left; color:var(--text-faint); font-weight:400; font-size:10.5px; letter-spacing:.5px; padding:6px 8px; border-bottom:1px solid var(--border); }
td{ padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.03); }
tr.home-row{ color: var(--accent-pink); }
tr.enemy-row{ color: var(--accent-cyan); }

.h2h-row{ display:grid; grid-template-columns:20px 1fr 1fr; gap:10px; align-items:center; margin-bottom:8px; font-size:12px; }
.h2h-bar{ display:flex; align-items:center; gap:6px; }

.h2h-bar.enemy .fill{ background:var(--accent-cyan); }
.h2h-label{ font-size:11px; color:var(--text-faint); width:40px; }

.btn{ background: var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:4px; font-size:12px; letter-spacing:.5px; }
.btn:hover{ background: #333d56; }
.btn.primary{ background: var(--accent-purple); border-color: var(--accent-purple); color:#fff; }
.btn.small{ padding:4px 10px; font-size:11px; }

.pill-toggle{ display:flex; gap:8px; margin-bottom:14px; }
.pill-toggle button{ flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); padding:10px; border-radius:4px; font-size:12px; letter-spacing:.5px; }
.pill-toggle button.active{ border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(139,110,240,0.08); }

.slot-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
@media (max-width:600px){ .slot-grid{ grid-template-columns:1fr; } }
.slot{ display:flex; justify-content:space-between; align-items:center; background:var(--panel-2); border:1px solid var(--border); border-radius:4px; padding:8px 10px; font-size:12px; }
.slot.filled{ border-color: var(--accent-teal); }
.slot .time{ color:var(--text-faint); }
.slot .who{ color:var(--text-dim); }
.slot.filled .who{ color: var(--accent-teal); }

.slot.mine .who{ color: var(--accent-pink); }

.slot button:hover{ color: var(--accent-red); }

.slot-cell{ display:flex; flex-direction:column; gap:3px; }
.slot-avail{ font-size:10px; color:var(--accent-amber); padding:0 10px; line-height:1.4; }

.day-tabs{ display:flex; gap:14px; border-bottom:1px solid var(--border); margin-bottom:14px; overflow-x:auto; }
.day-tabs button{ background:none;border:none;color:var(--text-dim); padding:8px 2px; font-size:12px; white-space:nowrap; border-bottom:2px solid transparent; }

.fill-status{ font-size:11px; color:var(--text-faint); margin-bottom:10px; letter-spacing:.5px; }

.planner-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.rank-list{ display:flex; flex-direction:column; gap:8px; }

.rank-item .left{ display:flex; flex-direction:column; gap:2px; }
.rank-item .left .name{ font-size:13px; }
.rank-item .left .desc{ font-size:11px; color:var(--text-faint); }
.rank-item .score{ font-size:14px; font-weight:700; color: var(--accent-active); }

.feedback-item{ background:var(--panel-2); border:1px solid var(--border); border-radius:4px; padding:12px; margin-bottom:10px; display:flex; gap:12px; }
.vote-box{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:36px; }

.vote-box .count{ font-size:13px; font-weight:700; }
.feedback-body .title{ font-size:13px; margin-bottom:3px; }
.feedback-body .meta{ font-size:10.5px; color:var(--text-faint); }
.status-badge{ font-size:9.5px; padding:2px 6px; border-radius:3px; letter-spacing:.5px; margin-left:6px; }
.status-badge.open{ background:rgba(53,201,232,0.15); color:var(--accent-cyan); }
.status-badge.planned{ background:rgba(224,184,67,0.15); color:var(--accent-gold); }
.status-badge.done{ background:rgba(78,203,133,0.15); color:var(--accent-green); }

textarea.feedback-input{ width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:4px; padding:10px; font-size:12.5px; min-height:70px; resize:vertical; }

.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; background: var(--panel); border-top:1px solid var(--border);

}
.bottom-nav a{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--text-faint); letter-spacing:.5px; }
.bottom-nav a.active{ color: var(--accent-cyan); }

.modal-overlay{ position:fixed; inset:0; background:rgba(10,12,20,0.7); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; width:100%; max-width:380px; }
.modal h3{ margin-top:0; font-size:16px; }
.modal .close{ float:right; background:none;border:none;color:var(--text-faint); font-size:16px; }
.modal input{ width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:4px; margin:10px 0; font-size:13px; }

.empty{ color:var(--text-faint); font-size:12.5px; text-align:center; padding:20px; }

.gate{ text-align:center; padding:30px 16px; color:var(--text-dim); }

.editable-note{ font-size:11px; color:var(--text-faint); margin:-4px 0 14px; }

.wizard-steps{ display:flex; gap:4px; margin-bottom:18px; }

.wizard-steps .bar{ height:3px; border-radius:2px; background:var(--panel-2); margin-bottom:6px; }
.wizard-steps .step.done .bar, .wizard-steps .step.active .bar{ background:var(--accent-purple); }
.wizard-steps .label{ font-size:9.5px; letter-spacing:1px; color:var(--text-faint); }
.wizard-steps .step.active .label{ color:var(--accent-purple); }

.section-title{ color:var(--accent-purple); font-size:12px; letter-spacing:1px; margin:22px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.section-title:first-child{ margin-top:0; }
.field-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px 20px; margin-bottom:6px; }

@media (max-width:420px){ .field-grid{ grid-template-columns:1fr; } }

.field-grid .field .rate{ display:block; color:var(--text-faint); font-size:10px; letter-spacing:0; text-transform:none; font-weight:400; margin-bottom:6px; min-height:13px; }
.field-unit{ position:relative; }
.field-unit input{ width:100%; padding-right:34px; }
.field-unit .unit-suffix{ position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--text-faint); }

.summary-row .k{ color:var(--text-faint); }

.points-row.total{ font-weight:700; color:var(--accent-purple); border-top:1px solid var(--border); margin-top:4px; padding-top:10px; }

</style>

<script>
// ---------------------------------------------------------------------------
// data.js — the "database" for this app.
//
// Everything is stored in the browser's localStorage under the "wos_" prefix,
// seeded the first time the app loads. This makes the app fully functional
// with zero backend setup. It is per-browser, not shared between visitors.
//
// To make data shared across everyone in your alliance/state (multi-user),
// swap the Store functions below for calls to a real backend — see
// README.md → "Going multi-user" for a Supabase schema you can start from.
// ---------------------------------------------------------------------------

const DEFAULT_STATE = {
  stateNumber: "3929",
  enemyState: "3897",
  svsDate: "2026-09-12",
  maxFurnaceLevel: "30",
  version: "v0.1.0",
};

// Roster — replace with your real alliance & player names, or manage this
// from the Admin page once the app is running.
const SEED_MEMBERS = [
  { id: "m1", name: "Chief Falcon", alliance: "STK", role: "admin" },
  { id: "m2", name: "Nightshade", alliance: "STK", role: "officer" },
  { id: "m3", name: "IronWolf", alliance: "SUN", role: "member" },

// Alliance tags — managed from Admin → Alliances (add/remove). Members pick
// their alliance from this list.
const SEED_ALLIANCES = ["STK", "SUN", "YUM"];

// Furnace bracket options for the backpack form's "current furnace level"
// field — managed from Admin → Furnace brackets (add/remove).
const SEED_FURNACE_FC = ["FC1", "FC2", "FC3", "FC4", "FC5", "FC6", "FC7", "FC8", "FC9", "FC10"];

// ---------------------------------------------------------------------------
// The backpack ("bag") submission form — what a member fills in on
// SvS prep → REQUEST, grouped into sections. `points` is the score per unit
// of that field (per hour for hrs fields, per item otherwise); leave it
// `null` for fields that aren't scored directly. Edit this to match your
// state's real SvS scoring rules.
// ---------------------------------------------------------------------------
const BAG_SECTIONS = [
  {
    title: "SPEEDUPS",
    fields: [
      { key: "sp_construction", label: "Construction", unit: "hrs", rateNote: null, points: null },
      { key: "sp_research", label: "Research", unit: "hrs", rateNote: null, points: null },
      { key: "sp_troop_train", label: "Troop Train", unit: "hrs", rateNote: null, points: null },
      { key: "sp_general", label: "General", unit: "hrs", rateNote: null, points: null },
    ],
  },
  {
    title: "D1 — CONSTRUCTION DAY",

      { key: "d2_expert_seals", label: "Expert Seals", rateNote: "6,000 pts per seal", points: 6000 },

const SEED_SCHEDULE_DAYS = ["Day 1 — Construction", "Day 2 — Research", "Day 4 — Troop"];

function emptySlots() {
  const slots = [];
  for (let h = 0; h < 24; h++) {
    for (let m of [0, 30]) {
      slots.push({
        time: `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`,
        member: null,
      });
    }
  }
  return slots;
}

const SEED_SCHEDULE = SEED_SCHEDULE_DAYS.reduce((acc, day) => {
  acc[day] = emptySlots();
  return acc;
}, {});

// Whether each day's schedule has been published by an admin yet. Regular
// members only see a day's assignments once it's true; admins always see
// the live/draft grid regardless of this flag.
const SEED_SCHEDULE_PUBLISHED = SEED_SCHEDULE_DAYS.reduce((acc, day) => {
  acc[day] = false;
  return acc;
}, {});

const SEED_FEEDBACK = [
  {
    id: "f1",
    title: "Add rally timer overlay",
    body: "Would help coordinate rally hits during SvS.",
    author: "Chief Falcon",
    votes: 4,
    status: "open",
    createdAt: Date.now() - 86400000 * 3,
  },
];

// there's a place for them once they're built. Add more entries here as

// ---------------------------------------------------------------------------
// Store — thin localStorage wrapper. Swap internals for API calls later.
// ---------------------------------------------------------------------------
const Store = {
  _get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  _set(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  },

  init() {
    if (!localStorage.getItem("wos_seeded_v2")) {
      this._set("wos_state", DEFAULT_STATE);
      this._set("wos_members", SEED_MEMBERS);
      this._set("wos_schedule", SEED_SCHEDULE);
      this._set("wos_schedule_published", SEED_SCHEDULE_PUBLISHED);
      this._set("wos_feedback", SEED_FEEDBACK);
      this._set("wos_alliances", SEED_ALLIANCES);
      this._set("wos_furnace_fc", SEED_FURNACE_FC);
      this._set("wos_bag_submissions", {});
      this._set("wos_current_user", null);
      localStorage.setItem("wos_seeded_v2", "1");
    }
  },

  get state() { return this._get("wos_state", DEFAULT_STATE); },
  set state(v) { this._set("wos_state", v); },

  get members() { return this._get("wos_members", []); },
  set members(v) { this._set("wos_members", v); },

  get schedule() { return this._get("wos_schedule", SEED_SCHEDULE); },
  set schedule(v) { this._set("wos_schedule", v); },

  // { [day]: boolean } — has an admin published this day's finalized
  // schedule for regular members to see yet?
  get schedulePublished() { return this._get("wos_schedule_published", SEED_SCHEDULE_PUBLISHED); },
  set schedulePublished(v) { this._set("wos_schedule_published", v); },

  get feedback() { return this._get("wos_feedback", SEED_FEEDBACK); },
  set feedback(v) { this._set("wos_feedback", v); },

  get alliances() { return this._get("wos_alliances", SEED_ALLIANCES); },
  set alliances(v) { this._set("wos_alliances", v); },

  get furnaceFc() { return this._get("wos_furnace_fc", SEED_FURNACE_FC); },
  set furnaceFc(v) { this._set("wos_furnace_fc", v); },

  // { [memberId]: { values: { [fieldKey]: number|string }, timezone, availabilityType,
  //   slots: { all: [bool*48] } | { byDay: { [day]: [bool*48] } }, notes, updatedAt } }
  get bagSubmissions() { return this._get("wos_bag_submissions", {}); },
  set bagSubmissions(v) { this._set("wos_bag_submissions", v); },

  get currentUser() { return this._get("wos_current_user", null); },
  set currentUser(v) { this._set("wos_current_user", v); },
};

function isAdmin(user) {
  return !!user && (user.role === "admin" || user.role === "leader" || user.role === "officer");
}

// Returns { bySection: [{title, points}], total } for a bag submission's values.
function computeBagPoints(values) {
  values = values || {};
  const bySection = BAG_SECTIONS.map((section) => {
    const points = section.fields.reduce((sum, f) => {
      if (f.points == null) return sum;
      return sum + (Number(values[f.key]) || 0) * f.points;
    }, 0);
    return { title: section.title, points };
  });
  const total = bySection.reduce((sum, s) => sum + s.points, 0);
  return { bySection, total };
}

function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h || "/";
}

function navigate(path) {
  location.hash = path;
}

function fmtNum(n) {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}

function tickClock() {
  const el = document.getElementById("clock");
  if (!el) return;
  const now = new Date();
  const hh = String(now.getUTCHours()).padStart(2, "0");
  const mm = String(now.getUTCMinutes()).padStart(2, "0");
  el.innerHTML = `${hh}:${mm} <span class="tz">UTC</span>`;
}
setInterval(tickClock, 15000);

function router() {
  const path = currentPath();
  const container = document.getElementById("app");
  if (!container) return;
  document
    .querySelectorAll(".bottom-nav a")
    .forEach((a) => a.classList.toggle("active", a.dataset.path === path));
  const renderer = ROUTES[path] || renderHome;
  container.innerHTML = "";
  renderer(container);
}

window.addEventListener("hashchange", () => { renderShell(); router(); });
window.addEventListener("DOMContentLoaded", () => {
  renderShell();
  router();
});

// Home page "▸ SVS SCHEDULE" section — only the days an admin has published,
// grouped by alliance so each alliance can see its own finalized assignments
// at a glance. Returns "" (renders nothing) until at least one day is live.
function renderPublishedScheduleByAlliance() {
  const published = Store.schedulePublished;
  const publishedDays = SEED_SCHEDULE_DAYS.filter((d) => published[d]);
  if (!publishedDays.length) return "";

  const sched = Store.schedule;
  const alliances = Store.alliances;
  const membersById = Object.fromEntries(Store.members.map((m) => [m.id, m]));

  const allianceBlocks = alliances
    .map((tag) => {
      const rows = [];
      publishedDays.forEach((day) => {
        (sched[day] || []).forEach((s) => {
          if (!s.member) return;
          const m = membersById[s.member.id];
          if (!m || m.alliance !== tag) return;
          rows.push({ day, time: s.time, name: s.member.name });
        });
      });
      if (!rows.length) return "";
      return `
        <div class="panel" style="background:var(--panel-2);">
          <div class="planner-header"><strong>${escapeHtml(tag)}</strong><span class="eyebrow">${rows.length} SLOT${rows.length === 1 ? "" : "S"}</span></div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            ${rows
              .map(
                (r) => `
              <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);">
                <span style="color:var(--text-dim);">${escapeHtml(r.day)} · ${r.time}</span>
                <span>${escapeHtml(r.name)}</span>
              </div>`
              )
              .join("")}
          </div>
        </div>`;
    })
    .filter(Boolean)
    .join("");

  return `
    <div class="section-label">▸ SVS SCHEDULE — PUBLISHED</div>
    <div class="grid2">
      ${allianceBlocks || `<div class="panel" style="color:var(--text-dim);font-size:12px;">Published, but no slots are assigned yet.</div>`}
    </div>
  `;
}

function countFilledSlots() {
  const sched = Store.schedule;
  return Object.values(sched).reduce((sum, day) => sum + day.filter((s) => s.member).length, 0);
}

// Members who marked themselves available for this day/slot-index on their
// SvS prep → REQUEST → TIME SLOTS submission (separate from the single
// "assigned" chief on the schedule grid — this is everyone who said they
// could be online).
function availableMembersForSlot(day, i) {
  const subs = Store.bagSubmissions;
  const members = Store.members;
  return Object.entries(subs)
    .filter(([memberId, sub]) => {
      // Count a slot as available if it was ever marked under EITHER
      // availability mode, not just whichever mode the submission ended up
      // on. A member can tap a slot under "ALL DAYS", then click over to
      // "BY DAY" just to look before submitting — that switches
      // availabilityType but the earlier tap is still sitting in
      // slots.all and should still count.
      const onAll = !!sub.slots?.all?.[i];
      const onDay = !!sub.slots?.byDay?.[day]?.[i];
      return onAll || onDay;
    })
    .map(([memberId]) => members.find((m) => m.id === memberId))
    .filter(Boolean);
}

      <h3>${title} <span style="color:${color}">${plus ? "+" : "▶"}</span></h3>
      <p>${desc}</p>

}

let svsTab = "request";
let svsDay = SEED_SCHEDULE_DAYS[0];
let svsWizardStep = "backpack";
let svsWizardDayTab = SEED_SCHEDULE_DAYS[0];
let svsDraft = null;

// Every slot on this page is UTC only — no per-member local-time picker.
// That's deliberate: mixed timezones on a shared schedule is how slots get
// double-booked or missed, so everyone reads and books off the same clock.
const FIXED_TIMEZONE = "UTC";

function renderSvS(el) {
  el.innerHTML = `
    <div class="tabs" style="--accent-active:var(--accent-purple)">
      <button data-t="request" class="${svsTab === "request" ? "active" : ""}">REQUEST</button>
      <button data-t="mysub" class="${svsTab === "mysub" ? "active" : ""}">MY SUBMISSION</button>
      <button data-t="mypoints" class="${svsTab === "mypoints" ? "active" : ""}">MY POINTS</button>
      <button data-t="schedule" class="${svsTab === "schedule" ? "active" : ""}">SCHEDULE</button>
    </div>
    <div id="svsBody"></div>
  `;
  el.querySelectorAll(".tabs button").forEach((b) =>
    b.addEventListener("click", () => { svsTab = b.dataset.t; if (svsTab === "request") svsWizardStep = svsWizardStep || "backpack"; renderSvS(el); })
  );
  const body = el.querySelector("#svsBody");
  if (svsTab === "request") renderSvSWizard(body);
  else if (svsTab === "mysub") renderSvSMySubmission(body);
  else if (svsTab === "mypoints") renderSvSMyPoints(body);
  else renderSvSSchedule(body);
}

function blankDraft() {
  return {
    values: {},
    timezone: FIXED_TIMEZONE,
    availabilityType: "all",
    slots: { all: Array(48).fill(false), byDay: SEED_SCHEDULE_DAYS.reduce((a, d) => ((a[d] = Array(48).fill(false)), a), {}) },
    notes: "",
    updatedAt: null,
  };
}

function loadDraft(user) {
  const existing = Store.bagSubmissions[user.id];
  if (existing) {
    // fill in any structure gaps (e.g. new schedule days) without losing saved data
    const d = blankDraft();
    return {
      ...d,
      ...existing,
      slots: {
        all: existing.slots?.all || d.slots.all,
        byDay: { ...d.slots.byDay, ...(existing.slots?.byDay || {}) },
      },
    };
  }
  return blankDraft();
}

function svsGate(el, msg) {

function renderSvSWizard(el) {
  const user = Store.currentUser;
  if (!user) return svsGate(el, "Sign in to request a slot");
  if (!svsDraft) svsDraft = loadDraft(user);

  const steps = [
    { id: "backpack", label: "BACKPACK" },
    { id: "review", label: "REVIEW" },
    { id: "timeslots", label: "TIME SLOTS" },
    { id: "submit", label: "SUBMIT" },
  ];
  const stepIdx = steps.findIndex((s) => s.id === svsWizardStep);

  el.innerHTML = `
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:2px;">svs_request</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">SvS · ${Store.state.svsDate}</div>

        ${steps
          .map(
            (s, i) => `
          <div class="step ${i === stepIdx ? "active" : ""} ${i < stepIdx ? "done" : ""}">

          </div>`

          .join("")}
      </div>
      <div id="wizardBody"></div>

  else if (svsWizardStep === "review") renderWizardReview(body, el);
  else if (svsWizardStep === "timeslots") renderWizardTimeSlots(body, el);
  else renderWizardSubmit(body, el);
}

      <button data-mode="byday" class="${mode === "byday" ? "active" : ""}">BY DAY<br><span style="font-size:10px;color:var(--text-faint);">Pick slots separately per day</span></button>
    </div>
    ${
      mode === "byday"
        ? `<div class="day-tabs">${SEED_SCHEDULE_DAYS.map((d) => `<button data-d="${d}" class="${d === svsWizardDayTab ? "active" : ""}">${d.toUpperCase()}</button>`).join("")}</div>`

      const arr = mode === "all" ? svsDraft.slots.all : svsDraft.slots.byDay[svsWizardDayTab];
      arr[i] = !arr[i];
      btn.classList.toggle("on", arr[i]);
    })
  );
  el.querySelector("#wizBack").onclick = () => { svsWizardStep = "review"; refreshSvS(); };
  el.querySelector("#wizNext").onclick = () => { svsWizardStep = "submit"; refreshSvS(); };
}

function slotTimeLabel(i) {
  const h = Math.floor(i / 2);
  const m = i % 2 === 0 ? "00" : "30";
  return `${String(h).padStart(2, "0")}:${m}`;
}

function countSelectedSlots() {
  if (svsDraft.availabilityType === "all") return { n: svsDraft.slots.all.filter(Boolean).length, denom: 48 };
  let n = 0;
  SEED_SCHEDULE_DAYS.forEach((d) => (n += (svsDraft.slots.byDay[d] || []).filter(Boolean).length));
  return { n, denom: 48 * SEED_SCHEDULE_DAYS.length };
}

function bestBuffDay() {
  const { bySection } = computeBagPoints(svsDraft.values);
  const dayScored = bySection.filter((s) => /^D\d/.test(s.title));
  if (!dayScored.length || dayScored.every((s) => s.points === 0)) return "—";
  const top = dayScored.reduce((a, b) => (b.points > a.points ? b : a));
  return `${top.title.split("—")[1]?.trim() || top.title} · ${fmtNum(top.points)}`;
}

function renderSvSSchedule(el) {
  const admin = isAdmin(Store.currentUser);

  const dayTabsHtml = `

  if (!admin) {
    el.innerHTML = `
      <div class="panel">
        <div class="planner-header">

            <strong>svs_schedule</strong>
            <span class="eyebrow"> · SvS ${Store.state.svsDate}</span>

              </div>`
            : `
              <div class="fill-status">${filled} / ${slots.length} SLOTS FILLED · FINALIZED</div>

                  .map((s, i) => {
                    const mine = s.member && Store.currentUser && s.member.id === Store.currentUser.id;
                    return `
                    <div class="slot-cell">
                      <div class="slot ${s.member ? "filled" : ""} ${mine ? "mine" : ""}">
                        <span class="time">${s.time}</span>
                        <span class="who">${s.member ? escapeHtml(s.member.name) : "— empty —"}</span>
                      </div>
                    </div>`;
                  })
                  .join("")}
              </div>`
        }

    el.querySelectorAll(".day-tabs button").forEach((b) =>
      b.addEventListener("click", () => { svsDay = b.dataset.d; renderSvSSchedule(el); })
    );
    return;
  }

  // Admin: unchanged live/draft grid with full editing + availability,
  // plus a publish/unpublish toggle for the currently-viewed day.
  el.innerHTML = `
    <div class="panel">
      <div class="planner-header">
        <div>
          <strong>svs_schedule</strong>
          <span class="eyebrow"> · SvS ${Store.state.svsDate}</span>
        </div>
        <button class="btn small" id="exportDay">EXPORT DAY</button>
      </div>
      ${dayTabsHtml}
      <div class="fill-status" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <span>${filled} / ${slots.length} SLOTS FILLED · PROVISIONAL</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:20px;background:${
            isPublished ? "rgba(62,207,142,.15)" : "rgba(255,176,32,.15)"
          };color:${isPublished ? "var(--accent-green)" : "var(--accent-amber)"};">
            ${isPublished ? "● PUBLISHED" : "○ DRAFT"}
          </span>
          <button class="btn small ${isPublished ? "" : "primary"}" id="togglePublish">
            ${isPublished ? "Unpublish this day" : "Publish this day"}
          </button>
        </span>
      </div>
      <div class="slot-grid">
        ${slots
          .map((s, i) => {
            const mine = s.member && Store.currentUser && s.member.id === Store.currentUser.id;
            const avail = availableMembersForSlot(svsDay, i);
            const availLine = avail.length
              ? `<div class="slot-avail">available: ${avail.map((m) => escapeHtml(m.name)).join(", ")}</div>`
              : `<div class="slot-avail empty-avail">no submissions for this slot</div>`;
            const members = Store.members;
            return `
            <div class="slot-cell">
              <div class="slot ${s.member ? "filled" : ""} ${mine ? "mine" : ""}">
                <span class="time">${s.time}</span>
                <select data-assign="${i}" style="flex:1;margin:0 8px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:3px;padding:3px 6px;font-size:11.5px;">
                  <option value="">— empty —</option>
                  ${members.map((m) => `<option value="${m.id}" ${s.member && s.member.id === m.id ? "selected" : ""}>${escapeHtml(m.name)}</option>`).join("")}
                </select>
              </div>
              ${availLine}
            </div>`;
          })
          .join("")}
      </div>
    </div>
  `;
  el.querySelectorAll(".day-tabs button").forEach((b) =>
    b.addEventListener("click", () => { svsDay = b.dataset.d; renderSvSSchedule(el); })
  );
  el.querySelector("#exportDay").onclick = () => {
    const rows = slots
      .map((s, i) => `${s.time}\t${s.member ? s.member.name : ""}\t${availableMembersForSlot(svsDay, i).map((m) => m.name).join(", ")}`)
      .join("\n");
    downloadText(`${svsDay.replace(/\s/g, "_")}.tsv`, `time\tassigned\tavailable\n${rows}`);
  };
  el.querySelector("#togglePublish").onclick = () => {
    const p = Store.schedulePublished;
    p[svsDay] = !p[svsDay];
    Store.schedulePublished = p;
    renderSvSSchedule(el);
  };
  el.querySelectorAll("[data-assign]").forEach((sel) =>
    sel.addEventListener("change", () => {
      const i = Number(sel.dataset.assign);
      const memberId = sel.value;
      const s = Store.schedule;
      if (!memberId) {
        s[svsDay][i].member = null;
      } else {
        const m = Store.members.find((mm) => mm.id === memberId);
        s[svsDay][i].member = m ? { id: m.id, name: m.name } : null;
      }
      Store.schedule = s;
      renderSvSSchedule(el);
    })
  );
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

      ${items
        .map(
          (it) => `
        <div class="feedback-item">
          <div class="vote-box">
            <button data-vote="${it.id}" data-dir="1">▲</button>

        )
        .join("") || `<div class="empty">No feedback yet. Be the first to post.</div>`}
    </div>
  `;
  el.querySelector("#fbSignIn")?.addEventListener("click", openSignIn);

    if (!text) return;
    const item = {
      id: "f" + Date.now(),

      body: text,

    };
    Store.feedback = [item, ...Store.feedback];
    renderFeedback(el);
  });

      const items2 = Store.feedback;

      it.votes += Number(b.dataset.dir);
      Store.feedback = items2;
      renderFeedback(el);
    })
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

            (it, i) => `
          <div style="display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;">
            <span style="flex:1;font-size:12px;">${escapeHtml(it.title || it.body.slice(0, 40))} <span style="color:var(--text-faint);">(${it.votes} votes)</span></span>
            <select data-fstatus="${i}" style="background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:3px;padding:4px 6px;font-size:11px;">
              ${["open", "planned", "done"].map((s) => `<option ${it.status === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
            <button data-fdel="${i}" class="btn small" style="color:var(--accent-red);">✕</button>
          </div>`
          )
          .join("") || `<div class="empty">No feedback submitted yet.</div>`}
      </div>
    </div>
  `;

  el.querySelector("#admAddAlliance").onclick = () => {
    const tag = el.querySelector("#admNewAlliance").value.trim();
    if (!tag) return;
    const a = Store.alliances;
    if (!a.includes(tag)) a.push(tag);
    Store.alliances = a;
    renderAdmin(el);
  };
  el.querySelectorAll("[data-adel]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.adel);
      const a = Store.alliances;
      a.splice(i, 1);
      Store.alliances = a;
      renderAdmin(el);
    })
  );

  el.querySelector("#admAddCategory").onclick = () => {
    const name = el.querySelector("#admNewCategory").value.trim();
    if (!name) return;
    const c = Store.furnaceFc;
    if (!c.includes(name)) c.push(name);
    Store.furnaceFc = c;
    renderAdmin(el);
  };
  el.querySelectorAll("[data-cdel]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.cdel);
      const c = Store.furnaceFc;
      c.splice(i, 1);
      Store.furnaceFc = c;
      renderAdmin(el);
    })
  );

  el.querySelector("#admSaveState").onclick = () => {
    Store.state = {
      ...st,
      stateNumber: el.querySelector("#admStateNum").value.trim(),
      enemyState: el.querySelector("#admEnemy").value.trim(),
      svsDate: el.querySelector("#admDate").value,
      maxFurnaceLevel: el.querySelector("#admFurnace").value.trim(),
    };
    el.querySelector("#admStateMsg").textContent = "Saved.";
    renderShell();
  };

  el.querySelectorAll("[data-mfield]").forEach((input) =>
    input.addEventListener("change", () => {
      const i = Number(input.dataset.idx);
      const field = input.dataset.mfield;
      const m = Store.members;
      m[i][field] = input.value;
      Store.members = m;
      if (Store.currentUser && Store.currentUser.id === m[i].id) {
        Store.currentUser = m[i];
        renderShell();
      }
    })
  );
  el.querySelectorAll("[data-mdel]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.mdel);
      const m = Store.members;
      m.splice(i, 1);
      Store.members = m;
      renderAdmin(el);
    })
  );
  el.querySelector("#admAddMember").onclick = () => {
    const name = el.querySelector("#admNewMember").value.trim();
    if (!name) return;
    Store.members = [...Store.members, { id: "m" + Date.now(), name, alliance: "", role: "member" }];
    renderAdmin(el);
  };
  el.querySelector("#admClearSlots").onclick = () => {
    const sched = Store.schedule;
    Object.keys(sched).forEach((day) => sched[day].forEach((s) => (s.member = null)));
    Store.schedule = sched;
    renderAdmin(el);
  };
  el.querySelectorAll("[data-fstatus]").forEach((sel) =>
    sel.addEventListener("change", () => {
      const i = Number(sel.dataset.fstatus);
      const fb = Store.feedback;
      fb[i].status = sel.value;
      Store.feedback = fb;
    })
  );
  el.querySelectorAll("[data-fdel]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.fdel);
      const fb = Store.feedback;
      fb.splice(i, 1);
      Store.feedback = fb;
      renderAdmin(el);
    })
  );
}

</script>
